server:
  port: 8082

spring:
  application:
    name: ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/supersys_vector_db}
    username: ${SPRING_DATASOURCE_USERNAME:apm}
    password: ${SPRING_DATASOURCE_PASSWORD:super_password_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: 123
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    vectorstore:
      pgvector:
        table-name: vector_store
        dimension: 384
        initialize-schema: true
    mcp:
      client:
        stdio:
          servers:
            github-server:
              command: npx
              args:
                - "-y"
                - "@modelcontextprotocol/server-github"
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  ratelimiter:
    instances:
      aiAnalysisLimiter:
        limitForPeriod: 3
        limitRefreshPeriod: 30s
        timeoutDuration: 0s
  circuitbreaker:
    instances:
      aiAnalysisBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted

supersys:
  ai:
    prompt:
      system: |
        Você é um administrador do qual vai escolher alguém de uma lista pegada desse banco vetorial, do qual vai ser o contexto em si, e vai saber escolher qual pessoa que é a melhor para fazer o serviço. Essa escolha vai ser puramente aleatória.
        
        --- CONTEXTO ADICIONAL DA BASE VETORIAL ---
        {context}
        -------------------------------------------
      project-system: |
        Você é um assistente de desenvolvimento sênior respondendo a perguntas sobre o projeto.
        O repositório deste projeto no GitHub é 'aldcejam/SUPER-OVER-MEGA-ENGINEER'.
        Você deve utilizar as ferramentas do GitHub (GitHub MCP tools) disponíveis para buscar informações no repositório ou responder à pergunta do usuário.
      user: |
        Pergunta do Usuário: {prompt}
        
        Resposta Clara e Sucinta:

