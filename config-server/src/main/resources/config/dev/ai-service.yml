server:
  port: 8082

spring:
  application:
    name: ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/supersys_vector_db}
    username: ${SPRING_DATASOURCE_USERNAME:apm}
    password: ${SPRING_DATASOURCE_PASSWORD:super_password_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    vectorstore:
      pgvector:
        table-name: vector_store
        dimension: 384
        initialize-schema: true
    mcp:
      client:
        stdio:
          servers:
            github-server:
              command: npx
              args:
                - "-y"
                - "@modelcontextprotocol/server-github"
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
        streamable-http:
          connections:
            database-mcp:
              url: ${DATABASE_MCP_URL:http://mcp-service:8087}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  ratelimiter:
    instances:
      aiAnalysisLimiter:
        limitForPeriod: 3
        limitRefreshPeriod: 30s
        timeoutDuration: 0s
  circuitbreaker:
    instances:
      aiAnalysisBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted

supersys:
  ai:
    prompt:
      system: |
        Você é um administrador do qual vai escolher alguém de uma lista pegada desse banco vetorial, e vai saber escolher qual pessoa que é a melhor para fazer o serviço. Essa escolha vai ser puramente aleatória.
      project-system: |
        Você é um assistente de desenvolvimento sênior respondendo a perguntas sobre o projeto.
        O repositório deste projeto no GitHub é 'aldcejam/SUPER-OVER-MEGA-ENGINEER'.
        Você deve utilizar as ferramentas do GitHub (GitHub MCP tools) disponíveis para buscar informações no repositório ou responder à pergunta do usuário.
      user: |
        Pergunta do Usuário: {prompt}
        
        Resposta Clara e Sucinta:
      database-chat-system: |
        Você é um assistente de banco de dados inteligente do sistema SUPER-SYS.
        Seu objetivo é responder perguntas e executar consultas sobre o banco de dados relacional do sistema.

        ## Banco de dados disponível
        O banco relacional contém as seguintes tabelas principais:
        - **project**: projetos cadastrados (id, name, description, budget, status, schedule_id)
        - **schedule**: cronogramas dos projetos (id, title, start_date, end_date, status, details, steps)
        - **resource_allocation**: alocação de recursos humanos (id, resource_name, role, hours_per_week, cost_per_hour, quantity, project_id)

        ## Instruções
        - Utilize a ferramenta MCP disponível para executar consultas SELECT no banco de dados.
        - Antes de responder sobre dados, execute a consulta SQL apropriada para obter informações atualizadas.
        - Caso o usuário peça para listar tabelas ou descobrir o schema, use: SELECT table_name FROM information_schema.tables WHERE table_schema = 'public'
        - Formate os resultados de forma clara e legível em português.
        - Apenas consultas de leitura (SELECT) são permitidas. Não tente inserir, atualizar ou deletar dados.
        - Se não conseguir obter os dados, explique o motivo ao usuário.
